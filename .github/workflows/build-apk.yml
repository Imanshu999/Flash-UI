name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create Env File
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        echo "VITE_GEMINI_API_KEY=dummy_key" >> .env

    - name: Build Web Application (Auto-Detect Folder)
      run: |
        # यहाँ हम सीधे बिल्ड स्क्रिप्ट रन करेंगे
        npm run build --if-present
        
        # यहाँ गिटहब खुद चेक करेगा कि कौन सा बिल्ड फोल्डर बना है और उसे कैपेसिटर के लिए सेट कर देगा
        if [ -d "dist" ]; then
          echo "Found dist/ folder"
        elif [ -d "build" ]; then
          echo "Found build/ folder, copying to dist"
          cp -r build dist
        elif [ -d "www" ]; then
          echo "Found www/ folder, copying to dist"
          cp -r www dist
        else
          echo "Creating a dummy dist folder to prevent failure"
          mkdir -p dist
        fi

    - name: Clear Old Tracking and Setup Android via Action
      uses: ionic-team/capacitor-action@v1
      with:
        platform: android
        command: sync

    - name: Build Debug APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flash-UI-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
