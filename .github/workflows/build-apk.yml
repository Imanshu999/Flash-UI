name: Capacitor Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # यहाँ हमने Android प्लेटफॉर्म को फिर से सेटअप करने का प्रोसेस सुधारा है
      - name: Add and Sync Android Platform
        run: |
          npm install @capacitor/android @capacitor/cli
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Kotlin वर्जन फिक्स करने के लिए लाइन जोड़ें
          echo "subprojects { configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } } }" >> android/build.gradle
          npx cap sync android

      # बिल्ड से पहले gradlew को फिर से इनिशियलाइज़ करना
      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashUI-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
