name: Capacitor Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # dependencies को इंस्टॉल करने का बेहतर तरीका
      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # यहाँ हमने स्पष्ट रूप से Capacitor CLI को इंस्टॉल किया है ताकि npx cap काम करे
      - name: Add and Sync Android Platform
        run: |
          npm install -g @capacitor/cli
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashUI-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
