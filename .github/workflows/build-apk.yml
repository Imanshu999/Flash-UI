name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Project Dependencies
      run: |
        npm install
        npm install lucide-react @capacitor/core @capacitor/cli @capacitor/android

    - name: Clean Start
      run: |
        # पुरानी कचरा फ़ाइलों को साफ़ कर रहे हैं
        rm -rf android/app/build/
        sed -i '/<ChatContainer/d' src/App.jsx || true

    - name: Build Web Application
      run: npx vite build

    - name: Capacitor Sync
      run: |
        npx cap telemetry off
        npx cap sync android

    - name: Build Debug APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        # --info जोड़ दिया है ताकि अगर फिर भी फेल हो, तो बताए कि असल में किस फाइल में एरर है
        ./gradlew assembleDebug --no-daemon --info
        
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flash-UI-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
