name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Project Dependencies
      run: npm install

    - name: Install Capacitor Core and CLI
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create Env File for Build
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        echo "VITE_GEMINI_API_KEY=dummy_key" >> .env

    - name: Build Web Application
      run: npm run build

    - name: Configure and Sync Capacitor Android
      run: |
        npx cap add android
        npx cap sync

    - name: Force Clear Corrupted Gradle Cache
      run: |
        rm -rf /home/runner/.gradle/caches/
        rm -rf android/.gradle/

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
