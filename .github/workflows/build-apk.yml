name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Project Dependencies
      run: |
        npm install
        npm install lucide-react @capacitor/core @capacitor/cli @capacitor/android

    - name: Hotfix - Remove Broken Component
      run: |
        sed -i '/<ChatContainer/d' src/App.jsx || true
        sed -i '/import.*ChatContainer/d' src/App.jsx || true

    - name: Build Web Application
      run: npx vite build

    - name: Capacitor Sync
      run: |
        npx cap telemetry off
        mkdir -p dist build www
        cp -r dist/* build/ 2>/dev/null || true
        cp -r dist/* www/ 2>/dev/null || true
        npx cap sync android

    - name: Build Debug APK via Gradle
      run: |
        cd android
        # ये कमांड ग्रैडल के साथ जावा वर्जन के झगड़े को खत्म कर देगी
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flash-UI-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
