name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install lucide-react @capacitor/core @capacitor/cli @capacitor/android

    - name: Force Clean Build
      run: |
        # 1. पुरानी सारी बिल्ड फाइलें डिलीट
        rm -rf android/app/build/
        # 2. कचरा लाइन हटाना
        sed -i '/<ChatContainer/d' src/App.jsx || true
        # 3. वेब बिल्ड
        npx vite build
        # 4. कैपेसिटर को फोर्स सिंक करना
        npx cap sync android --force

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Flash-UI-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
