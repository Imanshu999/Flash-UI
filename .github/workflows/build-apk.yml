name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create Env File
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        echo "VITE_GEMINI_API_KEY=dummy_key" >> .env

    - name: Build Web Application (Ignore TS)
      run: |
        npx vite build

    - name: Manual Capacitor Android Sync
      run: |
        npx cap telemetry off
        # अगर कॉन्फ़िगरेशन में कोई और फोल्डर नाम है, तो हम बैकअप बना देते हैं ताकि फेल न हो
        cp -r dist/ build/ || true
        cp -r dist/ www/ || true
        npx cap sync android

    - name: Build Debug APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flash-UI-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
